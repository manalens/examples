[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Manalens Example
ProjectVersion=1.0.0

; The Manalens plugin settings (Project Settings > Plugins > Manalens).
; The Publishable key (mana_pk_...) is safe to ship in a build.
; NEVER put a Secret key (mana_sk_) or an API key here: anyone who has the
; game can read this file.
[/Script/Manalens.ManalensSettings]
PublishableKey=
Endpoint=http://localhost:3101
Build=1
; Send events from Play in Editor (on by default since plugin v0.1.1).
; Dev and live data go to the same project: set Build (for example dev) for
; test runs and filter by it.
bEnabledInEditor=True
Storefront=Steam
; No events and no stored ID until the game calls Set Consent (true).
bConsentRequired=True
