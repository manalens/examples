<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cube Catch: Manalens three.js example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e2e8f0; font-family: system-ui, sans-serif; overflow: hidden; }
      #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-size: 15px; }
      #message { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; pointer-events: none; text-align: center; padding: 0 16px; }
    </style>
  </head>
  <body>
    <div id="hud"><span id="level"></span><span id="score"></span></div>
    <div id="message"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
