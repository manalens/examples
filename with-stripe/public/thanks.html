<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thanks: Manalens Stripe example</title>
    <script
      src="/snippet.global.js"
      data-publishable-key="%MANALENS_PUBLISHABLE_KEY%"
      data-endpoint="%MANALENS_ENDPOINT%"
      defer
    ></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #0f172a; }
    </style>
  </head>
  <body>
    <h1>Thanks for your purchase</h1>
    <p>
      Do not send the purchase from this page: a player can open it without
      paying. Manalens records the payment from the Stripe webhook,
      with the amount, refunds and the player ID.
    </p>
    <p><a href="/">Back to the store</a></p>
  </body>
</html>
